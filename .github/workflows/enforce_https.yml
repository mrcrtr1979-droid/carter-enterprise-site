name: enforce-https
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  pages: write
  contents: read
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: flip https_enforced once the certificate exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api repos/${{ github.repository }}/pages --jq .https_enforced)
          echo "https_enforced=$state"
          if [ "$state" = "true" ]; then echo "already enforced"; exit 0; fi
          gh api -X PUT repos/${{ github.repository }}/pages -f https_enforced=true && echo "enforced now" || echo "certificate not ready yet"
